<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="82" y1="52" x2="930" y2="972" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071B46"/>
      <stop offset="0.5" stop-color="#302064"/>
      <stop offset="1" stop-color="#160D32"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(512 490) rotate(90) scale(522)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D46D8" stop-opacity="0.62"/>
      <stop offset="0.58" stop-color="#4D2B9D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#071B46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="186" y1="128" x2="842" y2="904" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFF"/>
      <stop offset="0.38" stop-color="#CAD4EE"/>
      <stop offset="0.7" stop-color="#94A5CB"/>
      <stop offset="1" stop-color="#E0E7F8"/>
    </linearGradient>
    <linearGradient id="bezel" x1="210" y1="158" x2="790" y2="876" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242A47"/>
      <stop offset="1" stop-color="#101328"/>
    </linearGradient>
    <linearGradient id="topScreen" x1="202" y1="178" x2="824" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45E7F3"/>
      <stop offset="0.42" stop-color="#348CDC"/>
      <stop offset="0.78" stop-color="#7555E6"/>
      <stop offset="1" stop-color="#D364DF"/>
    </linearGradient>
    <linearGradient id="touchScreen" x1="335" y1="635" x2="699" y2="835" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF75C6"/>
      <stop offset="0.52" stop-color="#B451DC"/>
      <stop offset="1" stop-color="#536CE9"/>
    </linearGradient>
    <linearGradient id="hinge" x1="454" y1="460" x2="572" y2="558" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#B3C0DE"/>
    </linearGradient>
    <filter id="deviceShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#050613" flood-opacity="0.62"/>
    </filter>
    <filter id="controlShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#07091C" flood-opacity="0.7"/>
    </filter>
    <filter id="hingeShadow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#08091E" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#aura)"/>
  <path d="M-40 798L340 1024H-40V798Z" fill="#31BFE1" opacity="0.08"/>
  <path d="M1064 154L728 0H1064V154Z" fill="#ED6DD0" opacity="0.09"/>

  <!-- Top-display phone: the upper half of the open handheld. -->
  <g transform="rotate(-2.5 512 294)" filter="url(#deviceShadow)">
    <rect x="102" y="112" width="820" height="356" rx="94" fill="url(#metal)"/>
    <rect x="122" y="132" width="780" height="316" rx="77" fill="url(#bezel)"/>
    <rect x="190" y="164" width="644" height="252" rx="40" fill="url(#topScreen)"/>

    <path d="M213 187H811V224L213 349Z" fill="#FFFFFF" opacity="0.13"/>
    <path d="M217 378L390 221L531 329L681 190L809 304V393H217V378Z" fill="#071A47" opacity="0.17"/>
    <circle cx="316" cy="265" r="42" fill="#B8FAFF" opacity="0.14"/>
    <circle cx="708" cy="309" r="72" fill="#FFD2F2" opacity="0.12"/>

    <g fill="#697592">
      <circle cx="153" cy="225" r="7"/><circle cx="153" cy="251" r="7"/><circle cx="153" cy="277" r="7"/><circle cx="153" cy="303" r="7"/><circle cx="153" cy="329" r="7"/>
      <circle cx="871" cy="225" r="7"/><circle cx="871" cy="251" r="7"/><circle cx="871" cy="277" r="7"/><circle cx="871" cy="303" r="7"/><circle cx="871" cy="329" r="7"/>
    </g>
    <rect x="460" y="143" width="104" height="13" rx="6.5" fill="#73809E"/>
    <circle cx="585" cy="149.5" r="6.5" fill="#3E4967"/>
    <rect x="92" y="216" width="12" height="72" rx="6" fill="#8392B8"/>
  </g>

  <!-- Bottom controller phone: touch display plus DS-style virtual controls. -->
  <g transform="rotate(2.5 512 730)" filter="url(#deviceShadow)">
    <rect x="82" y="556" width="860" height="356" rx="96" fill="url(#metal)"/>
    <rect x="102" y="576" width="820" height="316" rx="78" fill="url(#bezel)"/>
    <rect x="128" y="602" width="768" height="264" rx="52" fill="#171A32"/>

    <rect x="326" y="628" width="372" height="208" rx="32" fill="url(#touchScreen)"/>
    <path d="M350 651H674V684L350 775Z" fill="#FFFFFF" opacity="0.14"/>
    <path d="M355 805L451 697L532 753L610 661L673 730V812H355V805Z" fill="#1B1D63" opacity="0.2"/>

    <g transform="translate(178 653)" fill="#C9D3EC" filter="url(#controlShadow)">
      <rect x="42" y="0" width="36" height="120" rx="11"/>
      <rect x="0" y="42" width="120" height="36" rx="11"/>
      <path d="M49 10L60 0L71 10H49ZM49 110H71L60 120L49 110ZM10 49V71L0 60L10 49ZM110 49L120 60L110 71V49Z" fill="#EEF2FF" opacity="0.72"/>
    </g>

    <g filter="url(#controlShadow)">
      <circle cx="786" cy="672" r="31" fill="#C9D3EC"/>
      <circle cx="842" cy="728" r="31" fill="#C9D3EC"/>
      <circle cx="730" cy="728" r="31" fill="#C9D3EC"/>
      <circle cx="786" cy="784" r="31" fill="#C9D3EC"/>
      <circle cx="786" cy="672" r="11" fill="#677595"/>
      <circle cx="842" cy="728" r="11" fill="#677595"/>
      <circle cx="730" cy="728" r="11" fill="#677595"/>
      <circle cx="786" cy="784" r="11" fill="#677595"/>
    </g>

    <g fill="#8592AF">
      <rect x="456" y="850" width="46" height="10" rx="5"/>
      <rect x="522" y="850" width="46" height="10" rx="5"/>
    </g>
    <rect x="930" y="674" width="12" height="76" rx="6" fill="#8392B8"/>
    <rect x="885" y="682" width="10" height="92" rx="5" fill="#697592"/>
  </g>

  <!-- A wireless hinge makes the two separate phones read as one open DS. -->
  <g filter="url(#hingeShadow)">
    <rect x="188" y="470" width="220" height="52" rx="26" fill="#1B203A" stroke="#AAB8D9" stroke-width="10"/>
    <rect x="616" y="502" width="220" height="52" rx="26" fill="#1B203A" stroke="#AAB8D9" stroke-width="10"/>
    <circle cx="512" cy="512" r="64" fill="url(#hinge)"/>
    <circle cx="512" cy="512" r="49" fill="#202642"/>
    <path d="M480 502C493 486 510 480 529 484" fill="none" stroke="#44D9EF" stroke-width="15" stroke-linecap="round"/>
    <path d="M526 475L543 487L530 503" fill="none" stroke="#44D9EF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M544 522C531 538 514 544 495 540" fill="none" stroke="#E260CF" stroke-width="15" stroke-linecap="round"/>
    <path d="M498 549L481 537L494 521" fill="none" stroke="#E260CF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
